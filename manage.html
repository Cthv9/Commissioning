<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Commissioning</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="sticky-top bg-white border-bottom">
    <div class="container py-2 d-flex gap-2 align-items-center">
      <a href="index.html" class="btn btn-primary">← Nuovo commissioning</a>
      <input id="searchInput" class="form-control" placeholder="Cerca (cantiere, barca, scafo, operatore...)">
      <button class="btn btn-outline-secondary" onclick="loadRecords()">Aggiorna</button>
    </div>
  </div>

  <div class="container py-4">
    <h1>Gestione Commissioning</h1>

    <!-- Tabella per visualizzare i record -->
    <table class="table table-bordered mt-3" id="recordsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cantiere</th>
          <th>Nome Barca</th>
          <th>Numero Scafo</th>
          <th>Matricola</th>
          <th>Tipo</th>
          <th>Operatore</th>
          <th>Data Inserimento</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Pulsante per tornare alla pagina principale -->
    <a href="index.html" class="btn btn-primary mt-3">Torna a Nuovo Commissioning</a>
  </div>

    <script>
    let allRecords = [];

    function render(records) {
      const tableBody = document.querySelector('#recordsTable tbody');
      tableBody.innerHTML = records.map(record => `
        <tr>
          <td>${record.ID ?? ''}</td>
          <td>${record.Cantiere ?? ''}</td>
          <td>${record['Nome Barca'] ?? ''}</td>
          <td>${record['Numero Scafo'] ?? ''}</td>
          <td>${record.Matricola ?? ''}</td>
          <td>${record.Tipo ?? ''}</td>
          <td>${record.Operatore ?? ''}</td>
          <td>${record['Data e Ora Inserimento'] ?? ''}</td>
          <td>
            <button class="btn btn-warning btn-sm" onclick="editRecord(${record.ID})">Modifica</button>
            <button class="btn btn-danger btn-sm" onclick="deleteRecord(${record.ID})">Elimina</button>
          </td>
        </tr>
      `).join('');
    }

    function applyFilter() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      if (!q) {
        render(allRecords);
        return;
      }

      const filtered = allRecords.filter(r => {
        const haystack = [
          r.ID,
          r.Cantiere,
          r['Nome Barca'],
          r['Numero Scafo'],
          r.Matricola,
          r.Tipo,
          r.Operatore,
          r['Data e Ora Inserimento'],
        ].join(' ').toLowerCase();
        return haystack.includes(q);
      });

      render(filtered);
    }

    async function loadRecords() {
      const response = await fetch('/records');
      allRecords = await response.json();

      // Ultimi inseriti in alto
      allRecords.sort((a, b) => (b.ID ?? 0) - (a.ID ?? 0));

      applyFilter();
    }

    async function editRecord(id) {
      const newName = prompt('Inserisci il nuovo nome della barca:');
      if (!newName) return;

      await fetch(`/records/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 'Nome Barca': newName })
      });

      loadRecords();
    }

    async function deleteRecord(id) {
      if (!confirm('Sei sicuro di voler eliminare questo record?')) return;

      await fetch(`/records/${id}`, { method: 'DELETE' });
      loadRecords();
    }

    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'searchInput') applyFilter();
    });

    loadRecords();
  </script>
</body>
</html>
