name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  # Build anche sulle PR verso main (incluse quelle di Dependabot), così una PR
  # si vede verde/rossa PRIMA del merge. La Release resta solo sui tag v*.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # richiesto per creare la GitHub Release sui tag v*

jobs:
  build:
    runs-on: windows-latest

    strategy:
      # Il profilo di dominio (Navale/Industriale) è deciso a BUILD-TIME (vedi
      # src-tauri/src/main.rs, option_env!("PORTALE_DOMAIN_PROFILE")): questa
      # matrix produce un installer distinto per ciascun profilo da questo
      # stesso repo/codebase, così non serve più mantenere due repository.
      matrix:
        include:
          - profile: navale
            product_name: 'Portale Commissioning'
            identifier: 'com.portalecommissioning.app'
          - profile: industriale
            product_name: 'Portale Commissioning Industriale'
            identifier: 'com.portalecommissioning.app.industriale'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ è richiesto per eseguire il tool di build @yao-pkg/pkg
          # (engines.node >=22.0.0) — non è il runtime del server in produzione,
          # che resta il binario impacchettato da pkg (vedi target sotto).
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build sidecar (server.exe + frontend)
        run: |
          npm run pkg:server
          npm run build:sidecar

      - name: Generate per-profile Tauri config
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.prod.conf.json', 'utf8'));
            cfg.productName = '${{ matrix.product_name }}';
            cfg.identifier = '${{ matrix.identifier }}';
            fs.writeFileSync('src-tauri/tauri.prod.profile.json', JSON.stringify(cfg, null, 2));
          "

      - name: Build installer (${{ matrix.profile }})
        env:
          # Letta a compile-time da option_env! in src-tauri/src/main.rs: determina
          # il profilo "cotto" in questo specifico binario/installer.
          PORTALE_DOMAIN_PROFILE: ${{ matrix.profile }}
        run: npx tauri build --config src-tauri/tauri.prod.profile.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          # Su una PR github.ref_name vale "<n>/merge": lo "/" non è ammesso nei nomi artifact.
          name: portale-commissioning-${{ matrix.profile }}-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create/aggiorna GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          # I due job della matrix (navale/industriale) pubblicano entrambi asset
          # sulla stessa Release (stesso tag): l'action gestisce l'upsert in modo
          # idempotente, non sovrascrive la Release se già creata dall'altro job.
