name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        # NB: usiamo "npm install" (non "npm ci") perché package-lock.json non è stato
        # rigenerato in questa PR: l'ambiente di sviluppo usato per questo intervento
        # non aveva accesso di rete a cdn.sheetjs.com (nuova fonte della dipendenza xlsx),
        # quindi il lockfile committato è ancora quello con la vecchia risoluzione xlsx/pkg.
        # "npm install" risolve comunque correttamente da qui in avanti. Appena qualcuno
        # esegue "npm install" con rete completa e committa il lockfile aggiornato, si può
        # ripristinare "npm ci" per build più rigorose/riproducibili.
        run: npm install

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: portale-commissioning-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
