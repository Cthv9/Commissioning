name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  # Build anche sulle PR verso main (incluse quelle di Dependabot), così una PR
  # si vede verde/rossa PRIMA del merge. La Release resta solo sui tag v*.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # richiesto per creare tag e GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ è richiesto per eseguire il tool di build @yao-pkg/pkg
          # (engines.node >=22.0.0) — non è il runtime del server in produzione,
          # che resta il binario impacchettato da pkg (vedi target sotto).
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build installer (sidecar + Tauri)
        run: npm run tauri:build

      - name: Build pacchetto MSIX (Microsoft Store)
        shell: pwsh
        # I valori reali vengono da Partner Center > Identità prodotto, salvati come
        # variabili del repository; senza, si usano valori di test (vedi README).
        # Passati via env e non interpolati nello script: un apostrofo nel nome
        # dell'editore romperebbe le virgolette.
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $params = @{}
          if ($env:MSIX_IDENTITY_NAME) { $params.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $params.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $params.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          if ($env:MSIX_DISPLAY_NAME) { $params.DisplayName = $env:MSIX_DISPLAY_NAME }
          ./scripts/build-msix.ps1 @params

      - name: Upload installer e MSIX
        uses: actions/upload-artifact@v4
        with:
          # Su una PR github.ref_name vale "<n>/merge": lo "/" non è ammesso nei nomi artifact.
          name: portale-commissioning-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            msix-out/*
          if-no-files-found: error

      # Release automatica: quando su main arriva una versione di package.json
      # che non ha ancora il suo tag v<versione>, la build crea tag e Release.
      # Per rilasciare basta alzare la versione e fare il merge.
      - name: Versione da rilasciare
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Versione $version senza tag: verrà creata la Release v$version"
          fi

      - name: Create/aggiorna GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          # Su un push del tag vale il tag stesso; su main quello della versione.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Setup per installazione diretta + MSIX da caricare in Partner Center.
          # Il pacchetto di test firmato resta solo tra gli artifact della build.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            msix-out/*-store.msix
          fail_on_unmatched_files: true
