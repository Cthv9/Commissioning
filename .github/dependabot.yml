version: 2
updates:
  # Una sola PR raggruppata per ecosystem (npm, cargo) invece di una PR per pacchetto.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-updates:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # multer 2.x è un breaking change che richiede un test manuale dell'upload
      # allegati (follow-up tracciato in TODO.md): non proporlo in automatico.
      - dependency-name: "multer"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    groups:
      cargo-updates:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
